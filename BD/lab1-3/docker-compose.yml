services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-xe
    shm_size: 1g
    ports:
      - "1521:1521"
      - "5500:5500"
    environment:
      ORACLE_PASSWORD: MyStrongPassw0rd
      APP_USER: labuser
      APP_USER_PASSWORD: labuser
    volumes:
      - oracle-data:/opt/oracle/oradata
      - .:/labs
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s

volumes:
  oracle-data:
    driver: local
